services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /app/data
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./data:/app/data
    ports:
      - '8000:8000'
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
